<div id="app"><header id="header"></header><main id="main"></main><nav class="nav" id="nav" aria-label="Navigation principale"></nav><div class="homebar"></div><div id="overlay"></div><div id="status" aria-live="polite"></div></div><div class="prototype">Maquette · données fictives · aucune connexion au coffre</div>
<script>
(()=>{const root=document.getElementById('app'),main=root.querySelector('#main'),header=root.querySelector('#header'),nav=root.querySelector('#nav'),overlay=root.querySelector('#overlay'),status=root.querySelector('#status');
const paths={key:'<circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-4-4 2-2"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',vault:'<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M12 7v2m0 6v2m-5-5h2m6 0h2"/>',settings:'<path d="M4 6h4m4 0h8M4 12h10m4 0h2M4 18h4m4 0h8"/><circle cx="10" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12h5"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',chevron:'<path d="m9 6 6 6-6 6"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',moon:'<path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[n]+'</svg>',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let entries=[{id:1,name:'GitHub',user:'mila@exemple.test',domain:'github.com',vault:'Personnel',star:true,brand:'github',color:'181717',password:'Demo-github-42!'},{id:2,name:'Figma',user:'design@exemple.test',domain:'figma.com',vault:'Équipe',star:true,brand:'figma',color:'F24E1E',password:'Demo-figma-42!'},{id:3,name:'Notion',user:'mila@exemple.test',domain:'notion.so',vault:'Personnel',star:false,brand:'notion',color:'202020',password:'Demo-notion-42!'},{id:4,name:'Vercel',user:'dev@exemple.test',domain:'vercel.com',vault:'Équipe',star:false,brand:'vercel',color:'202020',password:'Demo-vercel-42!'},{id:5,name:'Dropbox',user:'mila@exemple.test',domain:'dropbox.com',vault:'Personnel',star:false,brand:'dropbox',color:'0061FF',password:'Demo-dropbox-42!'}];
function brand(e){return '<span class="brandicon">'+(e.brand?'<img src="https://cdn.simpleicons.org/'+e.brand+'/'+e.color+'" alt="" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>'+icon('key')+'</span>':icon('key'))+'</span>'}
function toast(t){status.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(timer);timer=setTimeout(()=>status.innerHTML='',2300)}
function row(e){return '<div class="entry"><button class="openentry" data-entry="'+e.id+'">'+brand(e)+'<span style="min-width:0"><span class="entryname">'+esc(e.name)+(e.vault==='Équipe'?'<span class="pill">Équipe</span>':'')+'</span><span class="meta">'+esc(e.user)+'</span></span></button><button class="iconbutton '+(e.star?'starred':'')+'" data-star="'+e.id+'" aria-label="'+(e.star?'Retirer':'Ajouter')+' '+esc(e.name)+' des favoris" aria-pressed="'+e.star+'">'+icon('star')+'</button></div>'}
function drawList(){const found=entries.filter(e=>(!vaultFilter||e.vault===vaultFilter)&&(scope!=='Partagés'||e.vault==='Équipe')&&(scope!=='Favoris'||e.star)&&(!query||(e.name+' '+e.domain+' '+e.user).toLowerCase().includes(query.toLowerCase())));let html='';if(query||scope!=='Tous'||vaultFilter){html='<div class="section">'+found.length+' identifiant'+(found.length>1?'s':'')+'</div>'+found.map(row).join('')}else{const favorites=found.filter(e=>e.star),recent=found.filter(e=>!e.star);if(favorites.length)html+='<div class="section">Favoris</div>'+favorites.map(row).join('');if(recent.length)html+='<div class="section">Récents</div>'+recent.map(row).join('')}root.querySelector('#list').innerHTML=html||'<p class="empty">Aucun identifiant trouvé.<br>Essayez un autre nom ou un autre site.</p>'}
function render(){overlay.innerHTML='';header.innerHTML='<h1>'+({list:vaultFilter||'Identifiants',vaults:'Coffres',settings:'Réglages',autofill:'Autoremplissage',detail:'',auth:'Vaultix'}[page])+'</h1>'+(page==='list'?'<button class="iconbutton add" data-action="add" aria-label="Ajouter un identifiant">'+icon('plus')+'</button>':'');nav.hidden=page==='auth';nav.style.display=page==='auth'?'none':'';nav.innerHTML=[['list','key','Identifiants'],['vaults','vault','Coffres'],['settings','settings','Réglages']].map(([p,i,label])=>'<button data-page="'+p+'" class="'+((page===p||(page==='detail'&&p==='list')||(page==='autofill'&&p==='settings'))?'active':'')+'" '+(page===p?'aria-current="page"':'')+'><span class="navicon">'+icon(i)+'</span>'+label+'</button>').join('');
if(page==='list'){main.innerHTML=(vaultFilter?'<button class="textbutton" data-action="all-vaults">← Tous les identifiants</button>':'')+'<label class="search">'+icon('search')+'<input id="search" type="search" aria-label="Rechercher un identifiant" placeholder="Rechercher" value="'+esc(query)+'"></label><div class="scope">'+['Tous','Favoris','Partagés'].map(s=>'<button data-scope="'+s+'" class="'+(scope===s?'active':'')+'" aria-pressed="'+(scope===s)+'">'+s+'</button>').join('')+'</div><div id="list"></div>';drawList()}
if(page==='detail'){const e=entries.find(e=>e.id===selected);header.innerHTML='<button class="iconbutton back" data-page="list" aria-label="Retour aux identifiants">'+icon('back')+'</button><button class="iconbutton '+(e.star?'starred':'')+'" data-star="'+e.id+'" aria-label="Basculer le favori" aria-pressed="'+e.star+'">'+icon('star')+'</button>';main.innerHTML='<div class="detailtitle">'+brand(e)+'<h1>'+esc(e.name)+'</h1><span class="meta">'+esc(e.domain)+' · '+esc(e.vault)+'</span></div><div class="fields"><div class="field"><span class="label">Identifiant</span><div class="value">'+esc(e.user)+'<button class="iconbutton" data-copy="user" aria-label="Copier l’identifiant">'+icon('copy')+'</button></div></div><div class="field"><span class="label">Mot de passe</span><div class="value"><span>'+(revealed?esc(e.password):'••••••••••••')+'</span><button class="iconbutton" data-action="reveal" aria-label="Afficher ou masquer le mot de passe">'+icon('eye')+'</button></div></div><div class="field"><span class="label">Site associé</span><div class="value">'+esc(e.domain)+'</div></div></div><button class="primary" style="margin-top:28px" data-copy="password">Copier le mot de passe</button>'}
if(page==='vaults')main.innerHTML=['Personnel','Équipe'].map(v=>'<button class="vault" data-vault="'+v+'">'+icon('vault')+'<span><span class="entryname">'+v+'</span><span class="meta">'+(v==='Personnel'?'Privé':'Partagé')+'</span></span><span class="count">'+entries.filter(e=>e.vault===v).length+'</span>'+icon('chevron')+'</button>').join('');
if(page==='settings')main.innerHTML='<div class="section">Compte</div><div class="field"><span class="entryname">'+esc(authEmail)+'</span><span class="meta">Compte de démonstration</span></div><div class="section">Sur cet appareil</div><button class="settingsrow" data-page="autofill">'+icon('phone')+'<span class="body"><span class="entryname">Autoremplissage</span><span class="meta">'+(enabled?'Activé dans la maquette':'Configurer Vaultix')+'</span></span>'+icon('chevron')+'</button><button class="settingsrow" data-action="theme" role="switch" aria-checked="'+dark+'">'+icon('moon')+'<span class="body">Mode sombre</span><span class="toggle '+(dark?'on':'')+'"></span></button><button class="settingsrow" data-action="lock">'+icon('lock')+'<span class="body">Verrouiller le coffre</span>'+icon('chevron')+'</button>';
if(page==='autofill'){header.innerHTML='<button class="iconbutton back" data-page="settings" aria-label="Retour aux réglages">'+icon('back')+'</button>';main.innerHTML='<h1>Autoremplissage</h1><p class="smalltext">Utiliser les identifiants Vaultix dans vos applications et votre navigateur.</p><button class="settingsrow" data-action="enable" role="switch" aria-checked="'+enabled+'"><span class="body">Utiliser Vaultix</span><span class="toggle '+(enabled?'on':'')+'"></span></button><div class="demo"><span class="label">Essai · github.com</span><h2>Connexion</h2><input id="fill-user" aria-label="Identifiant simulé" placeholder="Identifiant" readonly><input id="fill-pass" aria-label="Mot de passe simulé" type="password" placeholder="Mot de passe" readonly><button class="primary" data-action="fill">Remplir avec Vaultix</button></div><p class="smalltext">Simulation locale. Les réglages du téléphone ne sont pas modifiés.</p>'}
if(page==='auth'){header.innerHTML=authStep?'<button class="iconbutton back" data-action="auth-back" aria-label="Retour">'+icon('back')+'</button>':'<h2>Vaultix</h2>';main.innerHTML='<div class="auth"><div class="progress" aria-label="Étape '+(authStep+1)+' sur 3">'+[0,1,2].map(i=>'<span class="'+(i<=authStep?'on':'')+'"></span>').join('')+'</div><h1>'+['Se connecter','Vérifier votre e-mail','Déverrouiller le coffre'][authStep]+'</h1><p class="smalltext">'+['Recevez un code pour vous connecter à votre compte.','Code envoyé à '+esc(authEmail)+'.','Votre mot de passe maître déchiffre le coffre sur cet appareil.'][authStep]+'</p><form id="auth-form"><label for="auth-input">'+['Adresse e-mail','Code à 6 chiffres','Mot de passe maître de démonstration'][authStep]+'</label><input id="auth-input" name="value" type="'+['email','text','password'][authStep]+'" '+(authStep===1?'inputmode="numeric" pattern="[0-9]{6}" maxlength="6"':'')+' value="'+(authStep===0?esc(authEmail):'')+'" required autocomplete="off"><p class="error" role="alert">'+authError+'</p><button class="primary">'+['Recevoir un code','Vérifier le code','Ouvrir le coffre'][authStep]+'</button></form>'+(authStep===1?'<button class="textbutton" data-action="resend">Renvoyer le code</button>':'')+'<p class="smalltext">'+['Démonstration : aucun e-mail envoyé.','Code de démonstration : 123456','Mot de passe de démonstration : vaultix-demo. Ne saisissez pas votre vrai mot de passe.'][authStep]+'</p></div>'}}
root.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;drawList()}});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;if(page==='list'){vaultFilter=null;query='';scope='Tous'}render();return}if(b.dataset.scope){scope=b.dataset.scope;render();return}if(b.dataset.entry){selected=Number(b.dataset.entry);revealed=false;page='detail';render();return}if(b.dataset.star){const item=entries.find(e=>e.id===Number(b.dataset.star));item.star=!item.star;if(page==='list')drawList();else render();return}if(b.dataset.vault){vaultFilter=b.dataset.vault;page='list';scope='Tous';query='';render();return}if(b.dataset.copy){const item=entries.find(e=>e.id===selected);try{await navigator.clipboard.writeText(item[b.dataset.copy]);toast('Copié')}catch{toast('Copie indisponible dans cet aperçu')}return}const action=b.dataset.action;if(action==='all-vaults'){vaultFilter=null;render()}if(action==='reveal'){revealed=!revealed;render()}if(action==='theme'){dark=!dark;root.classList.toggle('dark',dark);render()}if(action==='enable'){enabled=!enabled;render()}if(action==='lock'){page='auth';authStep=2;authError='';render()}if(action==='auth-back'){if(authStep>0)authStep--;authError='';render()}if(action==='resend'){toast('Code de démonstration : 123456')}if(action==='fill'){if(!enabled){toast('Activez « Utiliser Vaultix » pour essayer.');return}const item=entries.find(e=>e.domain==='github.com');root.querySelector('#fill-user').value=item.user;root.querySelector('#fill-pass').value=item.password;toast('Identifiant rempli')}if(action==='close'){overlay.innerHTML=''}if(action==='add'){overlay.innerHTML='<div class="sheetoverlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title"><div class="sheethead"><h2 id="add-title">Ajouter un identifiant</h2><button class="iconbutton" data-action="close" aria-label="Fermer">×</button></div><form id="add-form"><label for="name">Nom</label><input id="name" name="name" required maxlength="60"><label for="user">Identifiant</label><input id="user" name="user" required><label for="domain">Site</label><input id="domain" name="domain" placeholder="exemple.test" required><label for="password">Mot de passe de démonstration</label><input id="password" name="password" type="password" required minlength="8"><label for="vault">Coffre</label><select id="vault" name="vault"><option>Personnel</option><option>Équipe</option></select><button class="primary">Enregistrer</button></form></section></div>';root.querySelector('#name').focus()}});
root.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='add-form'){let domain;try{domain=new URL('https://'+String(f.get('domain')).replace(/^https?:\/\//,'')).hostname;if(!domain.includes('.'))throw Error()}catch{toast('Saisissez un site valide.');return}entries.unshift({id:Date.now(),name:String(f.get('name')).trim(),user:String(f.get('user')).trim(),domain,password:f.get('password'),vault:f.get('vault'),star:false});page='list';scope='Tous';query='';vaultFilter=null;render();toast('Identifiant enregistré dans la maquette')}if(e.target.id==='auth-form'){const value=String(f.get('value'));authError='';if(authStep===0){authEmail=value;authStep=1}else if(authStep===1){if(value==='123456')authStep=2;else authError='Code incorrect. Utilisez 123456.'}else{if(value==='vaultix-demo'){page='list';revealed=false}else authError='Utilisez vaultix-demo dans cette maquette.'}render()}});

})();
